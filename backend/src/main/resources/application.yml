server:
  port: 8080

spring:
  jackson:
    time-zone: Asia/Shanghai
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/moldtrial}
    username: ${SPRING_DATASOURCE_USERNAME:mold}
    password: ${SPRING_DATASOURCE_PASSWORD:mold}

logging:
  level:
    org.hibernate.SQL: warn
