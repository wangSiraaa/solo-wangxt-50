services:
  db:
    image: postgres:16-alpine
    container_name: moldtrial-db
    environment:
      POSTGRES_DB: moldtrial
      POSTGRES_USER: mold
      POSTGRES_PASSWORD: mold
    ports:
      - "5432:5432"
    volumes:
      - moldtrial-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mold -d moldtrial"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: moldtrial-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/moldtrial
      SPRING_DATASOURCE_USERNAME: mold
      SPRING_DATASOURCE_PASSWORD: mold
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: moldtrial-web
    depends_on:
      - backend
    ports:
      - "8088:80"

volumes:
  moldtrial-pg:
